name: Cloudflare media connection check
on:
  push:
    paths:
      - media-config.js
      - .github/workflows/media-connection-check.yml
  workflow_dispatch:
permissions:
  contents: read
jobs:
  check-media:
    runs-on: ubuntu-latest
    timeout-minutes: 3
    steps:
      - name: Verify Worker API, R2 access and login protection
        shell: bash
        run: |
          set -euo pipefail
          BASE="https://raspy-butterfly-c811.spiralcactus24.workers.dev"
          echo "Checking public Worker at $BASE"
          for entry in "health:200" "api/gallery:200" "api/auth:401"; do
            endpoint="${entry%:*}"
            expected="${entry##*:}"
            http_status=$(curl --silent --show-error --location --max-time 15 \
              --header "Origin: https://spiralcactus.be" \
              --output /tmp/worker-response --write-out "%{http_code}" \
              "$BASE/$endpoint") || { echo "::error::Unable to reach /$endpoint"; exit 1; }
            echo "/$endpoint -> HTTP $http_status (expected $expected)"
            cat /tmp/worker-response; echo
            if [ "$http_status" != "$expected" ]; then
              echo "::error::Cloudflare Worker /$endpoint returned HTTP $http_status, expected $expected"
              exit 1
            fi
          done
          echo "Checking browser preflight for Authorization header"
          preflight_status=$(curl --silent --show-error --max-time 15 -X OPTIONS \
            -H "Origin: https://spiralcactus.be" \
            -H "Access-Control-Request-Method: GET" \
            -H "Access-Control-Request-Headers: authorization" \
            -D /tmp/preflight-headers -o /tmp/preflight-response \
            -w "%{http_code}" "$BASE/api/auth")
          cat /tmp/preflight-headers
          test "$preflight_status" = "204" || { echo "::error::CORS preflight HTTP $preflight_status"; exit 1; }
          grep -iq "access-control-allow-origin: https://spiralcactus.be" /tmp/preflight-headers || { echo "::error::Missing CORS origin header"; exit 1; }
          grep -iq "access-control-allow-headers:.*Authorization" /tmp/preflight-headers || { echo "::error::Missing Authorization preflight header"; exit 1; }
          echo "Checking rejected login with an invalid, non-secret test credential"
          wrong_status=$(curl --silent --show-error --max-time 15 \
            -H "Origin: https://spiralcactus.be" \
            -H "Authorization: Bearer intentionally-invalid-test-secret-000000" \
            -D /tmp/auth-headers -o /tmp/auth-response -w "%{http_code}" "$BASE/api/auth")
          echo "Invalid login -> HTTP $wrong_status (expected 401)"
          test "$wrong_status" = "401" || { echo "::error::Unexpected login response HTTP $wrong_status"; exit 1; }
          grep -iq "access-control-allow-origin: https://spiralcactus.be" /tmp/auth-headers || { echo "::error::Authentication response lacks CORS header"; exit 1; }
          echo "Cloudflare Worker, R2, browser CORS and login protection passed."
