name: SpiralCactus Prelaunch QA
on:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  audit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Verify links, translations, JavaScript, images and sitemap
        run: python3 scripts/site_audit.py
      - name: Test R2 media API (mock bucket)
        run: node scripts/media_api_test.mjs
