name: Inspect artist SoundCloud tracks (temporary)
on:
  push:
    paths:
      - '.github/workflows/temporary-soundcloud-url-resolution.yml'
jobs:
  inspect:
    runs-on: ubuntu-latest
    timeout-minutes: 3
    steps:
      - name: List public artist recordings and playlists
        shell: bash
        run: |
          python3 - <<'PY'
          import urllib.request, urllib.parse, json
          client='QhVEWrrJKvW4uSU5u5EoI0FTXYUGzy5k'
          for artist,uid in [('ENTRAX',276353605),('TERAHMET',189100640)]:
              for category in ('tracks','playlists_without_albums'):
                  params=urllib.parse.urlencode(dict(client_id=client,limit=20,offset=0))
                  url=f'https://api-v2.soundcloud.com/users/{uid}/{category}?{params}'
                  print('===',artist,category,'===')
                  try:
                      req=urllib.request.Request(url,headers={'User-Agent':'Mozilla/5.0','Accept':'application/json'})
                      resp=urllib.request.urlopen(req,timeout=22)
                      data=json.load(resp)
                      items=data.get('collection',[]) if isinstance(data,dict) else data
                      print('COUNT',len(items))
                      for t in items[:18]:
                          if not isinstance(t,dict):continue
                          print(json.dumps({k:t.get(k) for k in ['id','title','permalink_url','kind','duration','playback_count','access','track_count','genre','sharing'] if k in t},ensure_ascii=False))
                  except Exception as e: print('ERROR',str(e))
          PY
