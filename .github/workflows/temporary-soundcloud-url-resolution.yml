name: Inspect artist SoundCloud profiles (temporary)
on:
  push:
    paths:
      - '.github/workflows/temporary-soundcloud-url-resolution.yml'
jobs:
  inspect:
    runs-on: ubuntu-latest
    timeout-minutes: 3
    steps:
      - name: Extract public SoundCloud hydration metadata
        shell: bash
        run: |
          python3 - <<'PY'
          import urllib.request, re, json
          for label,url in [('ENTRAX','https://soundcloud.com/noe-huvenne/tracks'),('TERAHMET','https://soundcloud.com/math-o-declercq/tracks')]:
              print('===',label,'===')
              req=urllib.request.Request(url,headers={'User-Agent':'Mozilla/5.0'})
              try:
                  content=urllib.request.urlopen(req,timeout=22).read().decode('utf-8','replace')
                  match=re.search(r'__sc_hydration\s*=\s*(\[.*?\]);',content,re.S)
                  print('HYDRATION FOUND',bool(match))
                  if match:
                      records=json.loads(match.group(1))
                      print('TYPES',[a.get('hydratable') for a in records])
                      for record in records:
                          name=record.get('hydratable')
                          data=record.get('data')
                          if name not in ('features','anonymousId','experiments','locale','clientId'):
                              print('RECORD',name,'TYPE',type(data).__name__,'KEYS',list(data.keys())[:30] if isinstance(data,dict) else 'NA')
                              if isinstance(data,dict):
                                  print('SELECT',json.dumps({k:data.get(k) for k in ('id','username','permalink','permalink_url','track_count','playlist_count','title','kind','uri') if k in data},ensure_ascii=False))
                              if isinstance(data,list):
                                  print('LIST_HEAD',json.dumps(data[:2],ensure_ascii=False)[:500])
              except Exception as e: print('ERROR',str(e))
          PY
